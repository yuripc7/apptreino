<script type="text/babel">
// AITab — Chat com IA sobre treino, nutrição, WOD e sugestões
function AITab() {
  const { useState, useEffect, useRef } = React;

  const [messages, setMessages] = useState(() => {
    const s = localStorage.getItem('yf_ai_chat');
    return s ? JSON.parse(s) : [{
      role: 'assistant',
      text: 'Olá! Sou seu coach de IA. Posso te ajudar com dúvidas sobre treino, técnica de execução, nutrição, gerar WODs de CrossFit ou sugerir ajustes de carga. Como posso te ajudar hoje?',
      time: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
    }];
  });
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const bottomRef = useRef(null);
  const inputRef = useRef(null);

  const quickActions = [
    { label: '💪 Gerar WOD', prompt: 'Gera um WOD de CrossFit para hoje. Varie entre AMRAP, For Time e EMOM. Inclua aquecimento.' },
    { label: '📊 Análise do progresso', prompt: `Analise meu progresso: peso atual ${localStorage.getItem('yf_weight') || '87'}kg, streak de ${localStorage.getItem('yf_streak') || '12'} dias. Dê sugestões específicas para continuar evoluindo.` },
    { label: '🍽️ Dica nutricional', prompt: 'Dê 3 dicas práticas de nutrição para quem está em processo de cutting com treino híbrido crossfit + academia.' },
    { label: '⚡ Ajuste de carga', prompt: 'Como saber quando é hora de aumentar a carga em um exercício? Qual é a regra geral para progressão de carga?' },
  ];

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages, loading]);

  const saveMessages = (msgs) => {
    setMessages(msgs);
    try { localStorage.setItem('yf_ai_chat', JSON.stringify(msgs.slice(-30))); } catch(e) {}
  };

  const getContext = () => {
    const weight = localStorage.getItem('yf_weight') || '87';
    const streak = localStorage.getItem('yf_streak') || '12';
    const { dayNames, defaultDayTypes, gymRoutines } = window.WORKOUT_DATA;
    const dayTypes = JSON.parse(localStorage.getItem('yf_dayTypes') || 'null') || defaultDayTypes;
    const today = new Date().getDay();
    const todayType = dayTypes[today];
    const todayRoutine = gymRoutines[today];
    const prs = JSON.parse(localStorage.getItem('yf_prs') || '{}');
    const prText = Object.entries(prs).filter(([,v]) => v).map(([k,v]) => `${k}: ${v}kg`).join(', ');

    return `Contexto do atleta:
- Nome: ${localStorage.getItem('yf_username') || 'Yuri'}
- Peso: ${weight}kg
- Streak: ${streak} dias treinando consecutivos
- Treino híbrido: CrossFit + Academia
- Hoje (${dayNames[today]}): ${todayType === 'Gym' ? `Academia — ${todayRoutine?.title || 'Treino'}` : todayType === 'Crossfit' ? 'CrossFit WOD' : 'Descanso'}
${prText ? `- PRs CrossFit: ${prText}` : ''}
- Objetivo atual: Cutting (perda de gordura mantendo massa muscular)`;
  };

  const sendMessage = async (text) => {
    if (!text.trim() || loading) return;
    const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    const userMsg = { role: 'user', text: text.trim(), time };
    const newMsgs = [...messages, userMsg];
    saveMessages(newMsgs);
    setInput('');
    setLoading(true);

    try {
      const systemContext = getContext();
      const history = newMsgs.slice(-8).map(m => ({
        role: m.role === 'user' ? 'user' : 'assistant',
        content: m.text
      }));

      // Injeta contexto no primeiro turno
      history[0] = {
        role: 'user',
        content: `${systemContext}\n\nPergunta: ${history[0].content}`
      };

      const response = await window.claude.complete({
        messages: history
      });

      const aiMsg = { role: 'assistant', text: response, time: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) };
      saveMessages([...newMsgs, aiMsg]);
    } catch(e) {
      const errMsg = { role: 'assistant', text: 'Desculpe, não consegui responder agora. Tente novamente.', time: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }), error: true };
      saveMessages([...newMsgs, errMsg]);
    } finally {
      setLoading(false);
    }
  };

  const clearChat = () => {
    const initial = [{
      role: 'assistant',
      text: 'Conversa reiniciada! Como posso te ajudar?',
      time: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
    }];
    saveMessages(initial);
  };

  // Formata texto com markdown básico
  const formatText = (text) => {
    return text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/^- (.+)/gm, '• $1')
      .replace(/\n/g, '<br>');
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: 'calc(100vh - 70px)', maxWidth: 480, margin: '0 auto' }}>
      {/* Header */}
      <div style={{ padding: '16px 16px 0', flexShrink: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
          <div>
            <h1 style={{ margin: 0, fontFamily: 'Orbitron', fontWeight: 900, fontSize: 22, color: 'var(--theme-text)', letterSpacing: '0.04em', textTransform: 'uppercase' }}>Coach IA</h1>
            <div style={{ fontFamily: 'Inter', fontSize: 12, color: 'var(--theme-text-muted)', marginTop: 3 }}>Treino · Nutrição · CrossFit</div>
          </div>
          <button onClick={clearChat} style={{ background: 'var(--theme-input)', border: '1px solid var(--theme-divider)', borderRadius: 10, padding: '7px 12px', color: 'var(--theme-text-muted)', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 8, letterSpacing: '0.12em', textTransform: 'uppercase', cursor: 'pointer' }}>LIMPAR</button>
        </div>

        {/* Quick actions */}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// ── PDF Parser com IA ──
async function parsePdfWithAI(pdfText) {
  // Estratégia: pede formato ultra-simples linha por linha, monta estrutura no JS
  const prompt = `Analise este texto de treino e liste os exercícios por dia da semana.

Use EXATAMENTE este formato (uma linha por exercício, sem JSON, sem markdown):
DIA | EXERCICIO | SERIES | REPETICOES | OBS

Exemplo:
SEGUNDA | Agachamento | 3 | 12 | Carga moderada
SEGUNDA | Leg Press | 4 | 15 |
TERCA | Supino | 3 | 10 |

Dias válidos: SEGUNDA, TERCA, QUARTA, QUINTA, SEXTA, SABADO, DOMINGO
Se não souber séries ou reps, use 3 e 10.
Não inclua cabeçalhos, não inclua linhas em branco desnecessárias.

Texto do treino:
${pdfText.slice(0, 2500)}`;

  const raw = await window.claude.complete(prompt);

  // Parseia o formato linha por linha
  const dayMap = {
    'SEGUNDA': 1, 'TERCA': 2, 'QUARTA': 3, 'QUINTA': 4,
    'SEXTA': 5, 'SABADO': 6, 'DOMINGO': 0,
    'SEG': 1, 'TER': 2, 'QUA': 3, 'QUI': 4, 'SEX': 5, 'SAB': 6, 'DOM': 0,
  };
  const dayNames = { 1: 'Segunda', 2: 'Terça', 3: 'Quarta', 4: 'Quinta', 5: 'Sexta', 6: 'Sábado', 0: 'Domingo' };

  const dias = {};
  const lines = raw.split('\n');

  for (const line of lines) {
    const parts = line.split('|').map(s => s.trim());
    if (parts.length < 3) continue;
    const [dayRaw, name, sets, reps, obs] = parts;
    const dayKey = dayRaw.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const dayId = dayMap[dayKey];
    if (dayId === undefined || !name) continue;
    if (!dias[dayId]) dias[dayId] = { titulo: dayNames[dayId], exercicios: [] };
    dias[dayId].exercicios.push({
      name: name.trim(),
      sets: (sets || '3').trim(),
      reps: (reps || '10').trim(),
      obs: (obs || '').trim(),
      video: '',
    });
  }

  if (Object.keys(dias).length === 0) {
    throw new Error('Não encontrei exercícios no PDF. Verifique se o arquivo está correto.');
  }

  // Converte para o formato esperado pelo app
  const result = { semana: 'PDF importado', dias: {} };
  Object.entries(dias).forEach(([dayId, data]) => {
    result.dias[dayNames[dayId]] = data;
  });

  return result;
}

  useEffect(() => {
    document.documentElement.classList.remove('mode-dark', 'mode-light');

  useEffect(() => {

  }, [tweaks.accentColor]);

    window.addEventListener('message', handler);

    return () => window.removeEventListener('message', handler);

        </div>

        )}
      </div>

      <div style={{ color: '#2A3545', fontSize: 11, marginTop: 32, textAlign: 'center' }}>
        Os dados ficam sincronizados entre dispositivos
      </div>
    </div>
  );
}

// ── Root — controla auth antes de montar o app ────────
function Root() {
  const { useState, useEffect, useRef } = React;
  const [phase, setPhase] = useState('loading'); // 'loading' | 'login' | 'app'
  const [userEmail, setUserEmail] = useState('');
  const mounted = useRef(false);

  useEffect(() => {
    if (mounted.current) return;
    mounted.current = true;
    window.CloudSync.init(
      (user) => { setUserEmail(user.email); setPhase('app'); },
      ()     => { setPhase('login'); }
    );
  }, []);

  window._logout = async () => {
    await window.CloudSync.logout();
  };
  window._userEmail = userEmail;

  if (phase === 'loading') {
    return (
      <div style={{
        minHeight: '100vh', background: '#0B0C10',
        display: 'flex', alignItems: 'center', justifyContent: 'center'
      }}>
        <div style={{
          width: 40, height: 40, borderRadius: '50%',
          border: '3px solid rgba(255,107,74,0.2)',
          borderTop: '3px solid #FF6B4A',
          animation: 'spin 0.8s linear infinite'
        }} />
        <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
      </div>
    );
  }

  if (phase === 'login') return <LoginScreen onAuth={() => {}} />;
  return <App />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
