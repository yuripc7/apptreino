  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {

    --theme-text: #E2E8F0;

    --shadow-card: 0 8px 32px -8px rgba(0,0,0,0.5);
    --blob-opacity: 0.07;
    --grid-opacity1: 0.015;
    --grid-opacity2: 0.01;
  }

  /* ── LIGHT MODE ── */
  html.mode-light {
    --theme-bg: #F5F3EF;
    --theme-card: #FFFFFF;
    --theme-text: #1A1A2E;
    --theme-text-muted: #7C8BA1;
    --theme-divider: #E8E4DC;
    --theme-highlight: #F9F7F4;
    --theme-input: #F0EDE8;
    --topbar-bg: rgba(245,243,239,0.92);
    --nav-bg: rgba(245,243,239,0.97);
    --shadow-card: 0 4px 20px -4px rgba(0,0,0,0.1), 20px 20px 60px #d8d4cc, -20px -20px 60px #ffffff;
    --blob-opacity: 0.06;
    --grid-opacity1: 0.4;
    --grid-opacity2: 0.18;
  }

  html, body {
    min-height: 100%;
    background-color: var(--theme-bg);
    color: var(--theme-text);
    font-family: 'Inter', system-ui, sans-serif;
    overscroll-behavior: none;
    transition: background-color 0.3s ease, color 0.3s ease;

  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,107,74,var(--grid-opacity1,0.015)) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,107,74,var(--grid-opacity1,0.015)) 1px, transparent 1px),
      linear-gradient(rgba(0,0,0,var(--grid-opacity2,0.01)) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,var(--grid-opacity2,0.01)) 1px, transparent 1px);
    background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
  }

  /* Blobs */
  body::after {
    content: '';
    position: fixed; top: -150px; right: -100px; width: 500px; height: 500px; z-index: 0; pointer-events: none;
    background: radial-gradient(circle, rgba(255,107,74,var(--blob-opacity,0.07)) 0%, transparent 70%);
  }

  #root { position: relative; z-index: 1; }

  /* Material Symbols */
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;

    line-height: 1;

    text-transform: none;

  ::-webkit-scrollbar-track { background: transparent; }

  /* Smooth scroll */
  .tab-content { overflow-y: auto; height: calc(100vh - 70px); scroll-behavior: smooth; }

  /* Animations */
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  }

  /* Hover states */
  button:not([disabled]):hover { filter: brightness(1.1); }
  button:not([disabled]):active { transform: scale(0.97); }

<!-- CloudSync — auth + persistência multi-usuário -->
<script>
// ╔══════════════════════════════════════════════════════╗
// ║  CONFIGURE AQUI — cole os valores do seu projeto     ║
// ║  em Supabase > Project Settings > API                ║
// ╚══════════════════════════════════════════════════════╝
window.SB_URL  = 'https://jhaaxyjmvcxfotkoalhq.supabase.co';
window.SB_KEY  = 'sb_publishable_S7P8lzgH2Z5I6eCgBjZMhw_u9P1EKc_';

(function() {
  const { createClient } = supabase;
  window._sb = createClient(window.SB_URL, window.SB_KEY);

  // Chaves excluídas do sync (fotos em base64 são grandes demais)
  const EXCLUDE = new Set(['yf_photos']);
  let _uid  = null;
  let _timer = null;

  // ── Patch localStorage para auto-sync ao salvar ──────
  const _origSet = localStorage.setItem.bind(localStorage);
  const _origDel = localStorage.removeItem.bind(localStorage);

  localStorage.setItem = function(key, value) {
    _origSet(key, value);
    if (key.startsWith('yf_') && _uid) _schedule();
  };
  localStorage.removeItem = function(key) {
    _origDel(key);
    if (key.startsWith('yf_') && _uid) _schedule();
  };

  function _getAll() {
    const obj = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('yf_') && !EXCLUDE.has(k)) obj[k] = localStorage.getItem(k);
    }
    return obj;
  }

  function _schedule() {
    if (_timer) clearTimeout(_timer);
    _timer = setTimeout(async () => {
      if (!_uid) return;
      await window._sb.from('user_data').upsert(
        { user_id: _uid, data: _getAll(), updated_at: new Date().toISOString() },
        { onConflict: 'user_id' }
      );
    }, 1500);
  }

  async function _load(uid) {
    const { data: row } = await window._sb
      .from('user_data').select('data').eq('user_id', uid).single();
    if (row?.data) {
      Object.entries(row.data).forEach(([k, v]) => {
        if (k.startsWith('yf_')) _origSet(k, v);
      });
    }
  }

  function _clear() {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k?.startsWith('yf_')) keys.push(k);
    }
    keys.forEach(k => _origDel(k));
  }

  // Expõe funções para o Root component
  window.CloudSync = {
    async init(onReady, onLogout) {
      const { data: { session } } = await window._sb.auth.getSession();
      if (session) {
        _uid = session.user.id;
        await _load(_uid);
        onReady(session.user);
      } else {
        onLogout();
      }
      window._sb.auth.onAuthStateChange(async (event, session) => {
        if (event === 'SIGNED_IN') {
          _uid = session.user.id;
          await _load(_uid);
          onReady(session.user);
        } else if (event === 'SIGNED_OUT') {
          _uid = null;
          _clear();
          onLogout();
        }
      });
    },
    async login(email, password) {
      const { error } = await window._sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    },
    async register(email, password) {
      const { error } = await window._sb.auth.signUp({ email, password });
      if (error) throw error;
    },
    async logout() {
      if (_timer) clearTimeout(_timer);
      await _schedule(); // flush pendente
      await window._sb.auth.signOut();
    },
    getEmail() {
      return window._sb.auth.getUser?.()?.data?.user?.email || '';
    }
  };
})();
</script>

<script type="text/babel">
// HomeTab — Dashboard semanal completo
function HomeTab({ tweaks, onStartTimer, onGoToWorkout }) {
  const { useState, useEffect } = React;

  const [water, setWater] = useState(() => {
    const s = localStorage.getItem('yf_water_' + new Date().toDateString());
    return s ? parseInt(s) : 0;
  });
  const [creatine, setCreatine] = useState(() =>
    localStorage.getItem('yf_creatine_' + new Date().toDateString()) === '1'
  );
  const [weight, setWeight] = useState(() => localStorage.getItem('yf_weight') || '87.15');
  const [streak, setStreak] = useState(() => parseInt(localStorage.getItem('yf_streak') || '12'));
  const [userName, setUserName] = useState(() => localStorage.getItem('yf_username') || 'Yuri');

  const waterGoal = 3960;
  const waterPct = Math.min((water / waterGoal) * 100, 100);
  const { dayNames, defaultDayTypes, gymRoutines } = window.WORKOUT_DATA;
  const dayTypes = JSON.parse(localStorage.getItem('yf_dayTypes') || 'null') || defaultDayTypes;
  const currentDay = new Date().getDay();
  const todayType = dayTypes[currentDay];
  const todayRoutine = gymRoutines[currentDay];
  const phrase = window.WORKOUT_DATA.motivationalPhrases[new Date().getDay() % window.WORKOUT_DATA.motivationalPhrases.length];
  const now = new Date();
  const hour = now.getHours();
  const greeting = hour < 12 ? 'Bom dia' : hour < 18 ? 'Boa tarde' : 'Boa noite';

  // Semana completa
  const weekDays = [1,2,3,4,5,6,0];
  const weekStats = weekDays.map(d => ({
    id: d,
    name: window.WORKOUT_DATA.dayShort[d],
    type: dayTypes[d],
    isToday: d === currentDay,
    isPast: d < currentDay || (currentDay === 0 && d > 0),
  }));

  // Volume semanal (exercícios × séries)
  const weekVolume = weekDays.reduce((acc, d) => {
    if (dayTypes[d] === 'Gym') {
      const r = gymRoutines[d];
      return acc + (r?.exercises?.reduce((a, e) => a + parseInt(e.sets || 0), 0) || 0);
    }
    return acc;
  }, 0);

  // Conquistas
  const achievements = [
    { id: 'streak7', icon: '🔥', label: '7 dias seguidos', unlocked: streak >= 7 },
    { id: 'streak30', icon: '💎', label: '30 dias', unlocked: streak >= 30 },
    { id: 'water', icon: '💧', label: 'Hidratado', unlocked: waterPct >= 100 },
    { id: 'creatine', icon: '💊', label: 'Suplementado', unlocked: creatine },
  ];

  const nextMeal = () => {
    if (hour < 8) return { time: '08:00', name: 'Café da Manhã' };
    if (hour < 12) return { time: '12:30', name: 'Almoço' };
    if (hour < 16) return { time: '16:00', name: 'Pré-treino' };
    return { time: '20:00', name: 'Jantar' };
  };
  const meal = nextMeal();

  const addWater = (ml) => {
    const nw = Math.min(water + ml, waterGoal);
    setWater(nw);
    localStorage.setItem('yf_water_' + new Date().toDateString(), nw);
  };

  const toggleCreatine = () => {
    const nv = !creatine;
    setCreatine(nv);
    localStorage.setItem('yf_creatine_' + new Date().toDateString(), nv ? '1' : '0');
  };

  const typeColor = (t) => t === 'Gym' ? 'var(--primary)' : t === 'Crossfit' ? '#A770EF' : 'var(--theme-text-muted)';
  const typeLabel = (t) => t === 'Gym' ? 'GYM' : t === 'Crossfit' ? 'CF' : 'REST';

  return (
    <div style={{ padding: '20px 16px 100px', maxWidth: 480, margin: '0 auto' }}>

      {/* ── HEADER ── */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 }}>
        <div>
          <div style={{ fontFamily: 'Inter', fontSize: 12, color: 'var(--theme-text-muted)', marginBottom: 3 }}>{greeting},</div>
          <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 26, color: 'var(--theme-text)', letterSpacing: '0.04em' }}>{userName.toUpperCase()}</div>

        <div style={{ textAlign: 'right' }}>

            <span style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 24, color: 'var(--primary)' }}>{streak}</span>
            <span style={{ fontFamily: 'Inter', fontSize: 11, color: 'var(--theme-text-muted)' }}>dias</span>

          </div>
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 6 }}>
            <div style={{ background: `${typeColor(todayType)}22`, border: `1px solid ${typeColor(todayType)}55`, borderRadius: 20, padding: '3px 10px' }}>
              <span style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 8, color: typeColor(todayType), letterSpacing: '0.15em' }}>{typeLabel(todayType)}</span>
            </div>
            {todayType === 'Gym' && todayRoutine?.exercises?.length > 0 && (
              <button onClick={onGoToWorkout} style={{ background: 'var(--primary)', border: 'none', borderRadius: 12, padding: '7px 14px', color: 'white', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 8, letterSpacing: '0.15em', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 5, boxShadow: '0 4px 12px -4px rgba(255,107,74,0.5)' }}>
                <span className="material-symbols-outlined" style={{ fontSize: 13 }}>play_arrow</span>

              </button>

          </div>
        </div>
        {todayType === 'Gym' && todayRoutine?.exercises?.length > 0 && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 7 }}>

            {todayRoutine.exercises.length > 4 && (

        {todayType === 'Crossfit' && (
          <div style={{ background: 'rgba(167,112,239,0.08)', borderRadius: 12, padding: '10px 14px', border: '1px solid rgba(167,112,239,0.2)' }}>
            <span style={{ fontFamily: 'Inter', fontSize: 13, color: 'var(--theme-text-muted)' }}>WOD do dia — veja na aba Treinos</span>
          </div>
        )}
        {todayType === 'Rest' && (
          <div style={{ textAlign: 'center', padding: '8px 0', color: 'var(--theme-text-muted)', fontSize: 13 }}>Recuperação ativa 💤 Descanse bem!</div>
        )}
      </div>

      {/* ── STATS RÁPIDOS ── */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10, marginBottom: 16 }}>
        {/* Peso */}
        <div style={{ background: 'var(--theme-card)', borderRadius: 18, padding: '14px 12px', border: '1px solid var(--theme-divider)', textAlign: 'center' }}>
          <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 7, letterSpacing: '0.18em', color: 'var(--theme-text-muted)', marginBottom: 6, textTransform: 'uppercase' }}>Peso</div>
          <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 18, color: 'var(--theme-text)', lineHeight: 1 }}>{weight}</div>
          <div style={{ fontFamily: 'Inter', fontSize: 10, color: 'var(--theme-text-muted)', marginTop: 3 }}>kg</div>
        </div>
        {/* Volume semanal */}
        <div style={{ background: 'var(--theme-card)', borderRadius: 18, padding: '14px 12px', border: '1px solid var(--theme-divider)', textAlign: 'center' }}>
          <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 7, letterSpacing: '0.18em', color: 'var(--theme-text-muted)', marginBottom: 6, textTransform: 'uppercase' }}>Volume</div>
          <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 18, color: 'var(--primary)', lineHeight: 1 }}>{weekVolume}</div>
          <div style={{ fontFamily: 'Inter', fontSize: 10, color: 'var(--theme-text-muted)', marginTop: 3 }}>séries/sem</div>
        </div>
        {/* Próxima refeição */}
        <div style={{ background: 'var(--theme-card)', borderRadius: 18, padding: '14px 12px', border: '1px solid var(--theme-divider)', textAlign: 'center' }}>
          <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 7, letterSpacing: '0.18em', color: 'var(--theme-text-muted)', marginBottom: 6, textTransform: 'uppercase' }}>Refeição</div>
          <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 15, color: 'var(--primary)', lineHeight: 1 }}>{meal.time}</div>
          <div style={{ fontFamily: 'Inter', fontSize: 10, color: 'var(--theme-text-muted)', marginTop: 3 }}>{meal.name.split(' ')[0]}</div>
        </div>
      </div>

      {/* ── HIDRATAÇÃO ── */}
      <div style={{ background: 'var(--theme-card)', borderRadius: 24, padding: '16px 18px', marginBottom: 14, border: '1px solid var(--theme-divider)' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
            <span className="material-symbols-outlined" style={{ color: '#60A5FA', fontSize: 18 }}>water_drop</span>
            <span style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 10, color: 'var(--theme-text)', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Hidratação</span>
          </div>
          <span style={{ fontFamily: 'Orbitron', fontWeight: 700, fontSize: 10, color: waterPct >= 100 ? '#10B981' : 'var(--theme-text-muted)' }}>
            {water}<span style={{ fontSize: 8 }}>/{waterGoal}ml</span>
            {waterPct >= 100 && <span style={{ marginLeft: 4 }}>✓</span>}
          </span>
        </div>
        <div style={{ height: 7, background: 'var(--theme-divider)', borderRadius: 99, overflow: 'hidden', marginBottom: 12 }}>
          <div style={{ height: '100%', width: `${waterPct}%`, background: waterPct >= 100 ? '#10B981' : 'linear-gradient(90deg,#60A5FA,#3B82F6)', borderRadius: 99, transition: 'width 0.4s ease' }}></div>
        </div>
        <div style={{ display: 'flex', gap: 7 }}>
          {[150, 250, 500].map(ml => (
            <button key={ml} onClick={() => addWater(ml)} style={{ flex: 1, background: 'rgba(96,165,250,0.08)', border: '1px solid rgba(96,165,250,0.22)', borderRadius: 11, padding: '9px 0', color: '#60A5FA', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 9, letterSpacing: '0.08em', cursor: 'pointer' }}>
              +{ml}ml
            </button>
          ))}
          <button onClick={() => { setWater(0); localStorage.setItem('yf_water_' + new Date().toDateString(), 0); }} style={{ background: 'rgba(239,68,68,0.07)', border: '1px solid rgba(239,68,68,0.18)', borderRadius: 11, padding: '9px 11px', color: '#EF4444', cursor: 'pointer', fontSize: 13 }}>↺</button>
        </div>
      </div>

      {/* ── HÁBITOS + TIMER ── */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 14 }}>
        {/* Creatina */}
        <div onClick={toggleCreatine} style={{ background: creatine ? 'rgba(255,107,74,0.07)' : 'var(--theme-card)', borderRadius: 18, padding: '14px', border: `1px solid ${creatine ? 'var(--primary)' : 'var(--theme-divider)'}`, cursor: 'pointer', transition: 'all 0.2s', display: 'flex', flexDirection: 'column', gap: 8 }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <span style={{ fontSize: 22 }}>💊</span>
            <div style={{ width: 22, height: 22, borderRadius: '50%', background: creatine ? 'var(--primary)' : 'var(--theme-divider)', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 0.2s' }}>
              {creatine && <span className="material-symbols-outlined" style={{ fontSize: 13, color: 'white' }}>check</span>}
            </div>
          </div>
          <div>
            <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 9, color: creatine ? 'var(--primary)' : 'var(--theme-text)', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Creatina</div>
            <div style={{ fontFamily: 'Inter', fontSize: 10, color: 'var(--theme-text-muted)' }}>5g diários</div>
          </div>
        </div>

        {/* Timer de descanso */}
        <div onClick={onStartTimer} style={{ background: 'var(--theme-card)', borderRadius: 18, padding: '14px', border: '1px solid var(--theme-divider)', cursor: 'pointer', transition: 'all 0.2s', display: 'flex', flexDirection: 'column', gap: 8 }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div style={{ width: 36, height: 36, borderRadius: '50%', background: 'rgba(255,107,74,0.1)', border: '2px solid var(--primary)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <span className="material-symbols-outlined" style={{ color: 'var(--primary)', fontSize: 18 }}>timer</span>
            </div>
            <span className="material-symbols-outlined" style={{ color: 'var(--theme-text-muted)', fontSize: 16 }}>chevron_right</span>
          </div>
          <div>
            <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 9, color: 'var(--theme-text)', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Timer</div>
            <div style={{ fontFamily: 'Inter', fontSize: 10, color: 'var(--theme-text-muted)' }}>Descanso entre séries</div>
          </div>
        </div>
      </div>

      {/* ── CONQUISTAS ── */}
      <div style={{ background: 'var(--theme-card)', borderRadius: 24, padding: '16px 18px', border: '1px solid var(--theme-divider)' }}>
        <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 8, letterSpacing: '0.22em', color: 'var(--theme-text-muted)', marginBottom: 12, textTransform: 'uppercase' }}>Conquistas de Hoje</div>
        <div style={{ display: 'flex', gap: 10 }}>
          {achievements.map(a => (
            <div key={a.id} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 5, opacity: a.unlocked ? 1 : 0.35, transition: 'all 0.3s' }}>
              <div style={{ width: 40, height: 40, borderRadius: 12, background: a.unlocked ? 'rgba(255,107,74,0.12)' : 'var(--theme-input)', border: `1px solid ${a.unlocked ? 'var(--primary)' : 'var(--theme-divider)'}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 18, boxShadow: a.unlocked ? '0 4px 12px -4px rgba(255,107,74,0.4)' : 'none', transition: 'all 0.3s' }}>
                {a.icon}
              </div>
              <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 6.5, letterSpacing: '0.05em', color: a.unlocked ? 'var(--primary)' : 'var(--theme-text-muted)', textAlign: 'center', lineHeight: 1.3, textTransform: 'uppercase' }}>{a.label}</div>
            </div>
          ))}
        </div>
      </div>

    </div>
  );
}

Object.assign(window, { HomeTab });

</script>
<script type="text/babel">
// WorkoutsTab — Semana de treinos + upload de PDF
function WorkoutsTab({ parsePdfWithAI }) {
  const { useState, useEffect, useRef } = React;
  const { dayNames, dayShort, defaultDayTypes, gymRoutines, crossfitMovements } = window.WORKOUT_DATA;

  const [dayTypes, setDayTypes] = useState(() => {
    const s = localStorage.getItem('yf_dayTypes');
    return s ? JSON.parse(s) : defaultDayTypes;
  });
  const [expandedDay, setExpandedDay] = useState(new Date().getDay());
  const [wods, setWods] = useState(() => {
    const s = localStorage.getItem('yf_wods'); return s ? JSON.parse(s) : {};
  });
  const [weights, setWeights] = useState(() => {
    const s = localStorage.getItem('yf_weights'); return s ? JSON.parse(s) : {};
  });
  const [prs, setPrs] = useState(() => {
    const s = localStorage.getItem('yf_prs'); return s ? JSON.parse(s) : {};
  });
  const [pdfs, setPdfs] = useState(() => {
    const s = localStorage.getItem('yf_pdfs');
    if (s) { try { return JSON.parse(s); } catch(e) { return []; } }
    return [];
  });
  const [activePdfIdx, setActivePdfIdx] = useState(null);
  const [activeTab, setActiveTab] = useState('week'); // 'week' | 'pdfs' | 'prs'
  const [aiParsing, setAiParsing] = useState(false);
  const [aiResult, setAiResult] = useState(null);
  const [aiError, setAiError] = useState(null);
  const [importedRoutines, setImportedRoutines] = useState(() => {
    const s = localStorage.getItem('yf_imported_routines');
    return s ? JSON.parse(s) : null;
  });
  const pdfInputRef = useRef(null);
  const currentDay = new Date().getDay();

  // Se houver rotinas importadas via IA, sobrepõem as padrão
  const activeRoutines = importedRoutines || gymRoutines;

  const handleTypeChange = (dayId, type) => {
    const n = { ...dayTypes, [dayId]: type };
    setDayTypes(n);
    localStorage.setItem('yf_dayTypes', JSON.stringify(n));
  };

  const handleWeightChange = (key, val) => {
    const n = { ...weights, [key]: val };
    setWeights(n);
    localStorage.setItem('yf_weights', JSON.stringify(n));
  };

  const handlePrChange = (key, val) => {
    const n = { ...prs, [key]: val };
    setPrs(n);
    localStorage.setItem('yf_prs', JSON.stringify(n));
  };

  const handleWodChange = (dayId, text) => {
    const n = { ...wods, [dayId]: text };
    setWods(n);
    localStorage.setItem('yf_wods', JSON.stringify(n));
  };

  const handlePdfUpload = (e) => {
    const file = e.target.files[0];
    if (!file || file.type !== 'application/pdf') return;
    const reader = new FileReader();
    reader.onloadend = () => {
      const newPdfs = [...pdfs, { name: file.name, data: reader.result, date: new Date().toLocaleDateString('pt-BR') }];
      setPdfs(newPdfs);
      try { localStorage.setItem('yf_pdfs', JSON.stringify(newPdfs)); } catch(e) {}
      setActivePdfIdx(newPdfs.length - 1);
      setActiveTab('pdfs');
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  };

  // Extrai texto do PDF usando PDF.js nativo do browser e chama parsePdfWithAI
  const handleExtractWithAI = async (pdf) => {
    if (!parsePdfWithAI) return;
    setAiParsing(true);
    setAiError(null);
    setAiResult(null);
    try {
      // Carrega PDF.js via CDN
      if (!window.pdfjsLib) {
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }

      // Converte data URL para ArrayBuffer
      const base64 = pdf.data.split(',')[1];
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

      // Carrega e extrai texto página por página
      const pdfDoc = await window.pdfjsLib.getDocument({ data: bytes }).promise;
      let fullText = '';
      for (let p = 1; p <= pdfDoc.numPages; p++) {
        const page = await pdfDoc.getPage(p);
        const content = await page.getTextContent();
        const pageText = content.items.map(item => item.str).join(' ');
        fullText += pageText + '\n';
      }

      const parsed = await parsePdfWithAI(fullText);
      setAiResult(parsed);
    } catch(err) {
      setAiError('Erro ao extrair: ' + err.message);
    } finally {
      setAiParsing(false);
    }
  };

  // Aplica rotinas extraídas pela IA ao app
  const applyAiRoutines = () => {
    if (!aiResult) return;
    // Aceita com e sem acento
    const dayMap = {
      'Segunda': 1, 'Terca': 2, 'Terça': 2,
      'Quarta': 3, 'Quinta': 4,
      'Sexta': 5, 'Sabado': 6, 'Sábado': 6, 'Domingo': 0
    };
    const newRoutines = { ...gymRoutines };
    Object.entries(aiResult.dias || {}).forEach(([dayName, data]) => {
      const dayId = dayMap[dayName];
      if (dayId !== undefined && data.exercicios) {
        newRoutines[dayId] = {
          title: data.titulo || dayName,
          exercises: data.exercicios.map(ex => ({
            name: ex.name || ex.nome || '',
            sets: String(ex.sets || ex.series || '3'),
            reps: String(ex.reps || ex.repeticoes || '10'),
            obs: ex.obs || ex.observacoes || '',
            video: ex.video || '',
          })).filter(ex => ex.name)
        };
      }
    });
    setImportedRoutines(newRoutines);
    localStorage.setItem('yf_imported_routines', JSON.stringify(newRoutines));
    setAiResult(null);
    setActiveTab('week');
  };

  const removePdf = (idx) => {
    const n = pdfs.filter((_, i) => i !== idx);
    setPdfs(n);
    try { localStorage.setItem('yf_pdfs', JSON.stringify(n)); } catch(e) {}
    if (activePdfIdx === idx) setActivePdfIdx(n.length > 0 ? 0 : null);
    else if (activePdfIdx > idx) setActivePdfIdx(activePdfIdx - 1);
  };

  const typeColor = (t) => t === 'Gym' ? 'var(--primary)' : t === 'Crossfit' ? '#A770EF' : 'var(--theme-text-muted)';
  const typeLabel = (t) => t === 'Gym' ? 'GYM' : t === 'Crossfit' ? 'CF' : 'REST';

  return (
    <div style={{ padding: '20px 16px 100px', maxWidth: 480, margin: '0 auto' }}>
      {/* Header */}
      <div style={{ marginBottom: 20, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div>
          <h1 style={{ margin: 0, fontFamily: 'Orbitron', fontWeight: 900, fontSize: 24, color: 'var(--theme-text)', letterSpacing: '0.04em', textTransform: 'uppercase' }}>Treinos</h1>
          <div style={{ fontFamily: 'Inter', fontSize: 12, color: 'var(--theme-text-muted)', marginTop: 4 }}>Híbrido: CrossFit + Academia</div>
        </div>
        <button onClick={() => pdfInputRef.current?.click()} style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'var(--primary)', border: 'none', borderRadius: 14, padding: '10px 16px', color: 'white', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 9, letterSpacing: '0.15em', textTransform: 'uppercase', cursor: 'pointer', boxShadow: '0 6px 20px -6px rgba(255,107,74,0.6)' }}>
          <span className="material-symbols-outlined" style={{ fontSize: 16 }}>upload_file</span>
          PDF
        </button>
        <input ref={pdfInputRef} type="file" accept="application/pdf" style={{ display: 'none' }} onChange={handlePdfUpload} />
      </div>

      {/* Sub-tabs */}
      <div style={{ display: 'flex', background: 'var(--theme-card)', borderRadius: 14, padding: 4, marginBottom: 20, border: '1px solid var(--theme-divider)', gap: 4 }}>
        {[['week', 'Semana'], ['pdfs', 'PDFs'], ['prs', 'PRs']].map(([val, label]) => (
          <button key={val} onClick={() => setActiveTab(val)} style={{ flex: 1, padding: '9px 0', borderRadius: 10, border: 'none', background: activeTab === val ? 'var(--primary)' : 'transparent', color: activeTab === val ? 'white' : 'var(--theme-text-muted)', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 9, letterSpacing: '0.15em', textTransform: 'uppercase', cursor: 'pointer', transition: 'all 0.2s' }}>
            {label}
          </button>
        ))}
      </div>

      {/* ── SEMANA ── */}
      {activeTab === 'week' && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {[0,1,2,3,4,5,6].map(dayId => {
            const isToday = dayId === currentDay;
            const isExpanded = expandedDay === dayId;
            const dayType = dayTypes[dayId];
            const routine = activeRoutines[dayId];
            const col = typeColor(dayType);

            return (
              <div key={dayId} style={{ background: 'var(--theme-card)', borderRadius: 20, border: `1px solid ${isToday ? col : 'var(--theme-divider)'}`, overflow: 'hidden', boxShadow: isToday ? `0 0 20px -8px ${col}55` : 'none', transition: 'all 0.2s' }}>
                {/* Row header */}
                <div onClick={() => setExpandedDay(isExpanded ? null : dayId)} style={{ padding: '14px 16px', display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer' }}>
                  <div style={{ width: 40, height: 40, borderRadius: 12, background: isToday ? col : 'var(--theme-divider)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', flexShrink: 0, transition: 'all 0.2s' }}>
                    <span style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 8, letterSpacing: '0.1em', color: isToday ? 'white' : 'var(--theme-text-muted)' }}>{dayShort[dayId]}</span>
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <span style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 13, color: 'var(--theme-text)', letterSpacing: '0.05em' }}>{dayNames[dayId]}</span>
                      {isToday && <span style={{ background: 'var(--primary)', color: 'white', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 7, letterSpacing: '0.2em', padding: '2px 8px', borderRadius: 99 }}>HOJE</span>}
                    </div>
                    <div style={{ fontFamily: 'Inter', fontSize: 11, color: 'var(--theme-text-muted)', marginTop: 2 }}>
                      {dayType === 'Gym' ? routine?.title : dayType === 'Crossfit' ? 'WOD · CrossFit' : 'Descanso'}
                    </div>
                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <span style={{ background: `${col}22`, border: `1px solid ${col}55`, borderRadius: 99, padding: '3px 10px', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 8, color: col, letterSpacing: '0.15em' }}>{typeLabel(dayType)}</span>
                    <span className="material-symbols-outlined" style={{ fontSize: 18, color: 'var(--theme-text-muted)', transition: 'transform 0.2s', transform: isExpanded ? 'rotate(180deg)' : 'rotate(0deg)' }}>expand_more</span>
                  </div>
                </div>

                {/* Expanded */}
                {isExpanded && (
                  <div style={{ borderTop: '1px solid var(--theme-divider)', padding: '16px' }}>
                    {/* Type switcher */}
                    <div style={{ display: 'flex', background: 'var(--theme-input)', borderRadius: 12, padding: 3, marginBottom: 16, gap: 3 }}>
                      {[['Crossfit', 'CrossFit'], ['Gym', 'Academia'], ['Rest', 'Descanso']].map(([val, lbl]) => (
                        <button key={val} onClick={() => handleTypeChange(dayId, val)} style={{ flex: 1, padding: '8px 0', borderRadius: 9, border: 'none', background: dayType === val ? 'var(--primary)' : 'transparent', color: dayType === val ? 'white' : 'var(--theme-text-muted)', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 8, letterSpacing: '0.12em', textTransform: 'uppercase', cursor: 'pointer', transition: 'all 0.2s' }}>
                          {lbl}
                        </button>
                      ))}
                    </div>

                    {/* Gym exercises */}
                    {dayType === 'Gym' && activeRoutines[dayId]?.exercises?.length > 0 && (
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                        {activeRoutines[dayId].exercises.map((ex, idx) => {
                          const wKey = `${dayId}-${idx}`;
                          return (

                      <span className="material-symbols-outlined" style={{ fontSize: 18 }}>auto_awesome</span>

                  {aiParsing && (
                    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12, padding: '20px 0' }}>

                    </div>

                  {aiResult && (
                    <div>
                      <div style={{ background: 'rgba(16,185,129,0.08)', border: '1px solid rgba(16,185,129,0.3)', borderRadius: 12, padding: '12px 14px', marginBottom: 12 }}>
                        <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 9, color: '#10B981', letterSpacing: '0.15em', marginBottom: 6 }}>✓ EXTRAÇÃO COMPLETA</div>
                        <div style={{ fontFamily: 'Inter', fontSize: 12, color: 'var(--theme-text-muted)' }}>
                          {aiResult.semana} — {Object.keys(aiResult.dias || {}).length} dias encontrados
                        </div>
                        {Object.entries(aiResult.dias || {}).map(([dia, data]) => (
                          <div key={dia} style={{ marginTop: 6, display: 'flex', gap: 8, alignItems: 'center' }}>
                            <span style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 8, color: 'var(--primary)', letterSpacing: '0.1em', width: 52, flexShrink: 0 }}>{dia.toUpperCase().slice(0,3)}</span>
                            <span style={{ fontFamily: 'Inter', fontSize: 11, color: 'var(--theme-text)' }}>{data.titulo} · {(data.exercicios || []).length} exercícios</span>
                          </div>
                        ))}
                      </div>
                      <div style={{ display: 'flex', gap: 8 }}>
                        <button onClick={applyAiRoutines} style={{ flex: 1, background: '#10B981', border: 'none', borderRadius: 12, padding: '12px', color: 'white', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 9, letterSpacing: '0.15em', textTransform: 'uppercase', cursor: 'pointer' }}>
                          APLICAR NA SEMANA
                        </button>
                        <button onClick={() => setAiResult(null)} style={{ background: 'var(--theme-input)', border: '1px solid var(--theme-divider)', borderRadius: 12, padding: '12px 14px', color: 'var(--theme-text-muted)', cursor: 'pointer', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 9, letterSpacing: '0.1em' }}>
                          ×
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* Banner se já houver rotinas importadas */}
              {importedRoutines && !aiResult && (
                <div style={{ background: 'rgba(16,185,129,0.06)', border: '1px solid rgba(16,185,129,0.2)', borderRadius: 14, padding: '10px 14px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <span className="material-symbols-outlined" style={{ fontSize: 16, color: '#10B981' }}>check_circle</span>
                    <span style={{ fontFamily: 'Inter', fontSize: 12, color: 'var(--theme-text-muted)' }}>Semana importada via IA</span>
                  </div>
                  <button onClick={() => { setImportedRoutines(null); localStorage.removeItem('yf_imported_routines'); }} style={{ background: 'transparent', border: 'none', color: 'var(--theme-text-muted)', cursor: 'pointer', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 8, letterSpacing: '0.1em', textTransform: 'uppercase' }}>
                    RESETAR
                  </button>
                </div>
              )}

              {/* Visualizador de PDF */}
              {activePdfIdx !== null && pdfs[activePdfIdx] && (
                <div style={{ background: 'var(--theme-card)', borderRadius: 20, overflow: 'hidden', border: '1px solid var(--theme-divider)' }}>
                  <div style={{ padding: '12px 16px', borderBottom: '1px solid var(--theme-divider)', display: 'flex', alignItems: 'center', gap: 8 }}>
                    <span className="material-symbols-outlined" style={{ fontSize: 16, color: 'var(--primary)' }}>picture_as_pdf</span>
                    <span style={{ fontFamily: 'Inter', fontWeight: 600, fontSize: 12, color: 'var(--theme-text)', flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{pdfs[activePdfIdx].name}</span>
                    <a href={pdfs[activePdfIdx].data} download={pdfs[activePdfIdx].name} style={{ display: 'flex', alignItems: 'center', gap: 4, background: 'rgba(255,107,74,0.1)', borderRadius: 8, padding: '5px 10px', color: 'var(--primary)', textDecoration: 'none' }}>
                      <span className="material-symbols-outlined" style={{ fontSize: 14 }}>download</span>
                    </a>
                  </div>
                  <iframe
                    src={pdfs[activePdfIdx].data}
                    style={{ width: '100%', height: 500, border: 'none', background: '#fff' }}

          )}
        </div>
      )}

      {/* ── PRs ── */}
      {activeTab === 'prs' && (
        <div>
          <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 9, letterSpacing: '0.2em', color: 'var(--theme-text-muted)', marginBottom: 14, textTransform: 'uppercase' }}>Recordes Pessoais — CrossFit</div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
            {crossfitMovements.map(mv => (
              <div key={mv} style={{ background: 'var(--theme-card)', borderRadius: 16, padding: '14px', border: '1px solid var(--theme-divider)' }}>
                <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 9, color: 'var(--theme-text-muted)', letterSpacing: '0.1em', marginBottom: 10, textTransform: 'uppercase' }}>{mv}</div>

                  <input
                    type="number"

                    value={prs[mv] || ''}
                    onChange={e => handlePrChange(mv, e.target.value)}

                  />

}

Object.assign(window, { WorkoutsTab });

<script type="text/babel">
// NutritionTab — Log de refeições + macros
function NutritionTab() {
  const { useState } = React;

  const TARGETS = { kcal: 2200, protein: 180, carbs: 150, fat: 70 };

  const [meals, setMeals] = useState(() => {
    const key = 'yf_meals_' + new Date().toDateString();
    const s = localStorage.getItem(key);
    return s ? JSON.parse(s) : [
      { time: '08:00', name: 'Café da Manhã', kcal: 450, protein: 35, carbs: 45, fat: 12, done: false },
      { time: '12:30', name: 'Almoço', kcal: 650, protein: 55, carbs: 60, fat: 18, done: false },
      { time: '16:00', name: 'Pré-treino', kcal: 300, protein: 25, carbs: 30, fat: 8, done: false },
      { time: '20:00', name: 'Jantar', kcal: 450, protein: 40, carbs: 35, fat: 14, done: false },
    ];
  });
  const [showAdd, setShowAdd] = useState(false);
  const [newMeal, setNewMeal] = useState({ time: '', name: '', kcal: '', protein: '', carbs: '', fat: '' });

  const saveMeals = (updated) => {
    setMeals(updated);
    localStorage.setItem('yf_meals_' + new Date().toDateString(), JSON.stringify(updated));
  };

  const toggleMeal = (i) => {
    const n = meals.map((m, idx) => idx === i ? { ...m, done: !m.done } : m);
    saveMeals(n);
  };

  const removeMeal = (i) => {
    saveMeals(meals.filter((_, idx) => idx !== i));
  };

  const addMeal = () => {
    if (!newMeal.name) return;
    saveMeals([...meals, { ...newMeal, kcal: +newMeal.kcal || 0, protein: +newMeal.protein || 0, carbs: +newMeal.carbs || 0, fat: +newMeal.fat || 0, done: false }]);
    setNewMeal({ time: '', name: '', kcal: '', protein: '', carbs: '', fat: '' });
    setShowAdd(false);
  };

  const doneMeals = meals.filter(m => m.done);
  const totals = doneMeals.reduce((acc, m) => ({
    kcal: acc.kcal + m.kcal,
    protein: acc.protein + m.protein,
    carbs: acc.carbs + m.carbs,
    fat: acc.fat + m.fat,
  }), { kcal: 0, protein: 0, carbs: 0, fat: 0 });

  const pct = (v, t) => Math.min(Math.round((v / t) * 100), 100);

  const MacroBar = ({ label, value, target, color, unit = 'g' }) => (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
        <span style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 8, letterSpacing: '0.2em', color: 'var(--theme-text-muted)', textTransform: 'uppercase' }}>{label}</span>
        <span style={{ fontFamily: 'Orbitron', fontWeight: 700, fontSize: 11, color: 'var(--theme-text)' }}>{value}<span style={{ color: 'var(--theme-text-muted)', fontWeight: 400 }}>/{target}{unit}</span></span>
      </div>
      <div style={{ height: 6, background: 'var(--theme-divider)', borderRadius: 99, overflow: 'hidden' }}>
        <div style={{ height: '100%', width: `${pct(value, target)}%`, background: color, borderRadius: 99, transition: 'width 0.5s ease' }}></div>
      </div>
    </div>
  );

  return (
    <div style={{ padding: '20px 16px 100px', maxWidth: 480, margin: '0 auto' }}>
      {/* Header */}
      <div style={{ marginBottom: 20, display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between' }}>
        <div>
          <h1 style={{ margin: 0, fontFamily: 'Orbitron', fontWeight: 900, fontSize: 24, color: 'var(--theme-text)', letterSpacing: '0.04em', textTransform: 'uppercase' }}>Nutrição</h1>
          <div style={{ fontFamily: 'Inter', fontSize: 12, color: 'var(--theme-text-muted)', marginTop: 4 }}>Cutting · {new Date().toLocaleDateString('pt-BR', { weekday: 'long' })}</div>
        </div>
      </div>

      {/* Calories hero */}
      <div style={{ background: 'linear-gradient(135deg, #FF9966 0%, #FF5E62 100%)', borderRadius: 24, padding: '20px 24px', marginBottom: 16, position: 'relative', overflow: 'hidden' }}>
        <div style={{ position: 'absolute', top: -20, right: -20, width: 100, height: 100, borderRadius: '50%', background: 'rgba(255,255,255,0.1)' }}></div>
        <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 8, letterSpacing: '0.25em', color: 'rgba(255,255,255,0.75)', marginBottom: 6, textTransform: 'uppercase' }}>Calorias Consumidas</div>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 6, marginBottom: 14 }}>
          <span style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 40, color: 'white', lineHeight: 1 }}>{totals.kcal}</span>
          <span style={{ fontFamily: 'Inter', fontSize: 14, color: 'rgba(255,255,255,0.7)' }}>/ {TARGETS.kcal} kcal</span>
        </div>
        {/* Barra de progresso */}
        <div style={{ height: 6, background: 'rgba(255,255,255,0.25)', borderRadius: 99, overflow: 'hidden' }}>
          <div style={{ height: '100%', width: `${pct(totals.kcal, TARGETS.kcal)}%`, background: 'white', borderRadius: 99, transition: 'width 0.5s' }}></div>
        </div>
        <div style={{ fontFamily: 'Inter', fontSize: 11, color: 'rgba(255,255,255,0.6)', marginTop: 6 }}>Restam {Math.max(TARGETS.kcal - totals.kcal, 0)} kcal</div>
      </div>

      {/* Macros */}
      <div style={{ background: 'var(--theme-card)', borderRadius: 24, padding: '18px 20px', marginBottom: 16, border: '1px solid var(--theme-divider)', display: 'flex', flexDirection: 'column', gap: 14 }}>
        <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 9, letterSpacing: '0.2em', color: 'var(--theme-text-muted)', textTransform: 'uppercase' }}>Macronutrientes</div>
        <MacroBar label="Proteína" value={totals.protein} target={TARGETS.protein} color="var(--primary)" />
        <MacroBar label="Carboidratos" value={totals.carbs} target={TARGETS.carbs} color="#A770EF" />
        <MacroBar label="Gorduras" value={totals.fat} target={TARGETS.fat} color="#60A5FA" />
      </div>

      {/* Refeições */}
      <div style={{ background: 'var(--theme-card)', borderRadius: 24, padding: '18px 20px', marginBottom: 16, border: '1px solid var(--theme-divider)' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
          <span style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 11, color: 'var(--theme-text)', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Refeições de Hoje</span>
          <button onClick={() => setShowAdd(!showAdd)} style={{ background: 'rgba(255,107,74,0.1)', border: '1px solid rgba(255,107,74,0.3)', borderRadius: 10, padding: '6px 12px', color: 'var(--primary)', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 8, letterSpacing: '0.15em', textTransform: 'uppercase', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 4 }}>
            <span className="material-symbols-outlined" style={{ fontSize: 14 }}>add</span>
            ADD
          </button>
        </div>

        {/* Form de nova refeição */}
        {showAdd && (
          <div style={{ background: 'var(--theme-input)', borderRadius: 16, padding: '14px', marginBottom: 14, border: '1px solid var(--theme-divider)' }}>
            <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 8, letterSpacing: '0.2em', color: 'var(--theme-text-muted)', marginBottom: 10, textTransform: 'uppercase' }}>Nova Refeição</div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 8 }}>
              <input placeholder="Horário (08:00)" value={newMeal.time} onChange={e => setNewMeal({...newMeal, time: e.target.value})} style={inputStyle} />
              <input placeholder="Nome" value={newMeal.name} onChange={e => setNewMeal({...newMeal, name: e.target.value})} style={inputStyle} />
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: 8, marginBottom: 10 }}>
              {[['kcal','Kcal'],['protein','Prot.'],['carbs','Carb.'],['fat','Gord.']].map(([k,lbl]) => (
                <input key={k} type="number" placeholder={lbl} value={newMeal[k]} onChange={e => setNewMeal({...newMeal, [k]: e.target.value})} style={{ ...inputStyle, textAlign: 'center' }} />
              ))}
            </div>
            <div style={{ display: 'flex', gap: 8 }}>

<script type="text/babel">
// ProgressTab — Evolução corporal, fotos e gráfico
function ProgressTab() {
  const { useState, useEffect, useRef } = React;

  const [entries, setEntries] = useState(() => {
    const s = localStorage.getItem('yf_progress');
    return s ? JSON.parse(s) : [
      { date: '01/03', peso: 89.4, bf: 27.8, mm: 33.9 },
      { date: '15/03', peso: 88.2, bf: 27.2, mm: 33.7 },
      { date: '01/04', peso: 87.15, bf: 26.9, mm: 33.6 },
    ];
  });

  const [photos, setPhotos] = useState(() => {
    const s = localStorage.getItem('yf_photos');
    return s ? JSON.parse(s) : [];
  });

  const [showAdd, setShowAdd] = useState(false);
  const [newEntry, setNewEntry] = useState({ date: '', peso: '', bf: '', mm: '' });
  const photoRef = useRef(null);
  const [activeChart, setActiveChart] = useState('peso');

  const saveEntries = (data) => {
    setEntries(data);
    localStorage.setItem('yf_progress', JSON.stringify(data));
  };

  const addEntry = () => {
    if (!newEntry.peso) return;
    const entry = {
      date: newEntry.date || new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }),
      peso: +newEntry.peso,
      bf: +newEntry.bf || 0,
      mm: +newEntry.mm || 0,
    };
    saveEntries([...entries, entry]);
    setNewEntry({ date: '', peso: '', bf: '', mm: '' });
    setShowAdd(false);
  };

  const handlePhotoUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onloadend = () => {
      const nw = [...photos, { src: reader.result, date: new Date().toLocaleDateString('pt-BR') }];
      setPhotos(nw);
      try { localStorage.setItem('yf_photos', JSON.stringify(nw)); } catch(e) {}
    };
    reader.readAsDataURL(file);
    e.target.value = '';

  const removePhoto = (i) => {
    const nw = photos.filter((_, idx) => idx !== i);

    const max = Math.max(...vals) + 0.5;
    const W = 320, H = 90;

    const py = (v) => H - ((v - min) / (max - min)) * (H - 20) - 5;

    const points = data.map((d, i) => `${px(i)},${py(d[field])}`).join(' ');
    const area = `M${px(0)},${py(data[0][field])} ` + data.slice(1).map((d, i) => `L${px(i+1)},${py(d[field])}`).join(' ') + ` L${px(data.length-1)},${H} L${px(0)},${H} Z`;

    return (

  return (

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 16 }}>
        <StatDiff label="Peso" val={latest.peso} unit="kg" d={diff(latest.peso, prev.peso)} />
        <StatDiff label="Gordura" val={latest.bf ? latest.bf + '%' : null} unit="%" d={diff(latest.bf, prev.bf)} />
        <StatDiff label="Massa Muscular" val={latest.mm} unit="kg" d={diff(latest.mm, prev.mm)} />
        <div style={{ background: 'linear-gradient(135deg, #A770EF 0%, #CF8BF3 100%)', borderRadius: 18, padding: '14px 16px' }}>
          <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 8, letterSpacing: '0.2em', color: 'rgba(255,255,255,0.7)', marginBottom: 8, textTransform: 'uppercase' }}>Registros</div>
          <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 28, color: 'white' }}>{entries.length}</div>
          <div style={{ fontFamily: 'Inter', fontSize: 11, color: 'rgba(255,255,255,0.7)', marginTop: 4 }}>medições</div>
        </div>
      </div>

      {/* Formulário */}
      {showAdd && (
        <div style={{ background: 'var(--theme-card)', borderRadius: 20, padding: '16px', marginBottom: 16, border: '1px solid var(--primary)' }}>
          <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 9, letterSpacing: '0.2em', color: 'var(--theme-text-muted)', marginBottom: 12, textTransform: 'uppercase' }}>Nova Medição</div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 10 }}>
            {[['date','Data (dd/mm)'],['peso','Peso (kg)'],['bf','Gordura (%)'],['mm','Massa Musc. (kg)']].map(([k,lbl]) => (
              <input key={k} type={k === 'date' ? 'text' : 'number'} placeholder={lbl}
                value={newEntry[k]}

              />

          <div style={{ display: 'flex', gap: 8 }}>
            <button onClick={addEntry} style={{ flex: 1, background: 'var(--primary)', border: 'none', borderRadius: 10, padding: '10px', color: 'white', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 9, letterSpacing: '0.15em', textTransform: 'uppercase', cursor: 'pointer' }}>Salvar</button>
            <button onClick={() => setShowAdd(false)} style={{ background: 'var(--theme-input)', border: '1px solid var(--theme-divider)', borderRadius: 10, padding: '10px 14px', color: 'var(--theme-text-muted)', cursor: 'pointer', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 9 }}>×</button>

      {/* Gráfico */}
      <div style={{ background: 'var(--theme-card)', borderRadius: 24, padding: '18px 20px', marginBottom: 16, border: '1px solid var(--theme-divider)' }}>
        <div style={{ display: 'flex', gap: 6, marginBottom: 16 }}>
          {[['peso', 'Peso', 'var(--primary)'], ['bf', 'Gordura', '#A770EF'], ['mm', 'Massa', '#4AC29A']].map(([k, lbl, col]) => (
            <button key={k} onClick={() => setActiveChart(k)} style={{ flex: 1, padding: '7px 0', borderRadius: 10, border: 'none', background: activeChart === k ? col : 'var(--theme-input)', color: activeChart === k ? 'white' : 'var(--theme-text-muted)', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 8, letterSpacing: '0.12em', textTransform: 'uppercase', cursor: 'pointer', transition: 'all 0.2s' }}>

        <div style={{ padding: '8px 0 16px' }}>

<script type="text/babel">
// TimerTab — Timer de descanso com som
function TimerTab({ initialSeconds = 90, onBack }) {
  const { useState, useEffect, useRef, useCallback } = React;

  const PRESETS = [30, 45, 60, 90, 120, 180];

  const [preset, setPreset] = useState(() => {
    return parseInt(localStorage.getItem('yf_timer_preset') || '90');
  });
  const [seconds, setSeconds] = useState(preset);
  const [running, setRunning] = useState(false);
  const [finished, setFinished] = useState(false);
  const intervalRef = useRef(null);
  const audioCtxRef = useRef(null);

  useEffect(() => {
    if (!running) return;
    setFinished(false);
    intervalRef.current = setInterval(() => {
      setSeconds(s => {
        if (s <= 1) {
          clearInterval(intervalRef.current);
          setRunning(false);
          setFinished(true);
          playFinishSound();
          return 0;
        }
        if (s === 4) playBeep(880, 0.1);
        if (s === 3) playBeep(880, 0.1);
        if (s === 2) playBeep(880, 0.1);
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, [running]);

  const getAudioCtx = () => {
    if (!audioCtxRef.current) {
      audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtxRef.current;
  };

  const playBeep = (freq = 660, vol = 0.15, dur = 0.12) => {
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(vol, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.start(); osc.stop(ctx.currentTime + dur);
    } catch(e) {}
  };

  const playFinishSound = () => {
    try {
      const ctx = getAudioCtx();
      [[0, 660], [0.18, 880], [0.36, 1100], [0.54, 880]].forEach(([t, f]) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = f;
        osc.type = 'triangle';
        gain.gain.setValueAtTime(0.3, ctx.currentTime + t);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.3);
        osc.start(ctx.currentTime + t);
        osc.stop(ctx.currentTime + t + 0.35);
      });
    } catch(e) {}
  };

  const handleStart = () => {
    if (seconds === 0) setSeconds(preset);
    setRunning(true);
    setFinished(false);
    playBeep(440, 0.1, 0.08);
  };

  const handlePause = () => {
    clearInterval(intervalRef.current);
    setRunning(false);
  };

  const handleReset = () => {
    clearInterval(intervalRef.current);
    setRunning(false);
    setFinished(false);
    setSeconds(preset);
  };

  const handlePreset = (s) => {
    clearInterval(intervalRef.current);
    setRunning(false);
    setFinished(false);
    setPreset(s);
    setSeconds(s);
    localStorage.setItem('yf_timer_preset', s);
  };

  const mm = String(Math.floor(seconds / 60)).padStart(2, '0');
  const ss = String(seconds % 60).padStart(2, '0');
  const progress = seconds / preset;

  // SVG circular progress
  const R = 90;
  const circ = 2 * Math.PI * R;
  const offset = circ * (1 - (1 - progress));

  return (
    <div style={{ padding: '20px 16px 100px', maxWidth: 480, margin: '0 auto' }}>
      {/* Header */}
      <div style={{ marginBottom: 28 }}>
        <h1 style={{ margin: 0, fontFamily: 'Orbitron', fontWeight: 900, fontSize: 24, color: 'var(--theme-text)', letterSpacing: '0.04em', textTransform: 'uppercase' }}>Timer</h1>
        <div style={{ fontFamily: 'Inter', fontSize: 12, color: 'var(--theme-text-muted)', marginTop: 4 }}>Descanso entre séries</div>
      </div>

      {/* Presets */}
      <div style={{ display: 'flex', gap: 8, marginBottom: 32, flexWrap: 'wrap' }}>
        {PRESETS.map(s => (
          <button key={s} onClick={() => handlePreset(s)} style={{ flex: 1, minWidth: 52, padding: '8px 0', borderRadius: 12, border: `1px solid ${preset === s ? 'var(--primary)' : 'var(--theme-divider)'}`, background: preset === s ? 'rgba(255,107,74,0.12)' : 'var(--theme-card)', color: preset === s ? 'var(--primary)' : 'var(--theme-text-muted)', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 9, letterSpacing: '0.12em', cursor: 'pointer', transition: 'all 0.2s' }}>
            {s >= 60 ? `${s/60}min` : `${s}s`}
          </button>
        ))}
      </div>

      {/* Circular timer */}
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', marginBottom: 32 }}>
        <div style={{ position: 'relative', width: 220, height: 220 }}>
          <svg width="220" height="220" viewBox="0 0 220 220" style={{ transform: 'rotate(-90deg)' }}>
            {/* Track */}
            <circle cx="110" cy="110" r={R} fill="none" stroke="var(--theme-divider)" strokeWidth="10" />
            {/* Progress */}
            <circle
              cx="110" cy="110" r={R}
              fill="none"
              stroke={finished ? '#10B981' : running ? 'var(--primary)' : 'var(--theme-text-muted)'}
              strokeWidth="10"
              strokeLinecap="round"
              strokeDasharray={circ}
              strokeDashoffset={circ - (circ * (1 - progress))}
              style={{ transition: running ? 'stroke-dashoffset 1s linear, stroke 0.3s' : 'stroke 0.3s' }}
            />
          </svg>

          {/* Center text */}
          <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
            {finished ? (
              <div style={{ textAlign: 'center' }}>
                <div style={{ fontSize: 40, marginBottom: 4 }}>🎯</div>
                <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 11, color: '#10B981', letterSpacing: '0.2em' }}>PRONTO!</div>

            ) : (
              <>
                <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 48, color: 'var(--theme-text)', lineHeight: 1, letterSpacing: '0.02em' }}>{mm}:{ss}</div>
                <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 8, letterSpacing: '0.25em', color: 'var(--theme-text-muted)', marginTop: 6, textTransform: 'uppercase' }}>{running ? 'DESCANSANDO' : 'PAUSADO'}</div>
              </>
            )}
          </div>
        </div>
      </div>

      {/* Controls */}
      <div style={{ display: 'flex', gap: 12, justifyContent: 'center', marginBottom: 24 }}>
        <button onClick={handleReset} style={{ width: 56, height: 56, borderRadius: '50%', background: 'var(--theme-card)', border: '1px solid var(--theme-divider)', color: 'var(--theme-text-muted)', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 0.2s' }}>
          <span className="material-symbols-outlined" style={{ fontSize: 22 }}>replay</span>
        </button>

        <button onClick={running ? handlePause : handleStart} style={{ width: 72, height: 72, borderRadius: '50%', background: finished ? '#10B981' : 'var(--primary)', border: 'none', color: 'white', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: `0 8px 24px -6px ${finished ? 'rgba(16,185,129,0.6)' : 'rgba(255,107,74,0.6)'}`, transition: 'all 0.2s' }}>
          <span className="material-symbols-outlined" style={{ fontSize: 32 }}>{running ? 'pause' : 'play_arrow'}</span>
        </button>

        <button onClick={() => { handleReset(); setSeconds(preset + 30); setPreset(prev => prev + 30); }} style={{ width: 56, height: 56, borderRadius: '50%', background: 'var(--theme-card)', border: '1px solid var(--theme-divider)', color: 'var(--theme-text-muted)', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 0.2s', fontSize: 13 }}>
          <span style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 9, textAlign: 'center', lineHeight: 1.2 }}>+30<br/>seg</span>
        </button>
      </div>

      {/* Dica */}
      <div style={{ background: 'var(--theme-card)', borderRadius: 16, padding: '14px 18px', border: '1px solid var(--theme-divider)', textAlign: 'center' }}>
        <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 8, letterSpacing: '0.2em', color: 'var(--theme-text-muted)', marginBottom: 4, textTransform: 'uppercase' }}>Referência</div>
        <div style={{ fontFamily: 'Inter', fontSize: 12, color: 'var(--theme-text-muted)', lineHeight: 1.5 }}>Força: 2–3 min · Hipertrofia: 60–90s · Resistência: 30–45s</div>
      </div>
    </div>
  );
}

<script type="text/babel">
// ActiveWorkoutTab — Modo treino ativo com checklist de séries + timer automático
function ActiveWorkoutTab({ onBack }) {
  const { useState, useEffect, useRef } = React;
  const { defaultDayTypes, gymRoutines } = window.WORKOUT_DATA;
  const dayTypes = JSON.parse(localStorage.getItem('yf_dayTypes') || 'null') || defaultDayTypes;
  const importedRoutines = JSON.parse(localStorage.getItem('yf_imported_routines') || 'null');
  const activeRoutines = importedRoutines || gymRoutines;
  const currentDay = new Date().getDay();
  const routine = activeRoutines[currentDay];

  // Estado de séries: { "exIdx-setIdx": true/false }
  const [done, setDone] = useState({});
  const [weights, setWeights] = useState(() => {
    const s = localStorage.getItem('yf_weights'); return s ? JSON.parse(s) : {};
  });

  // Timer de descanso
  const [timerActive, setTimerActive] = useState(false);
  const [timerSecs, setTimerSecs] = useState(0);
  const [timerTotal, setTimerTotal] = useState(90);
  const [lastCompletedEx, setLastCompletedEx] = useState(null);
  const intervalRef = useRef(null);
  const audioCtxRef = useRef(null);

  // Progresso
  const totalSets = routine?.exercises?.reduce((a, e) => a + parseInt(e.sets || 0), 0) || 0;
  const doneSets = Object.values(done).filter(Boolean).length;
  const pct = totalSets > 0 ? Math.round((doneSets / totalSets) * 100) : 0;

  useEffect(() => {
    if (!timerActive) { clearInterval(intervalRef.current); return; }
    intervalRef.current = setInterval(() => {
      setTimerSecs(s => {
        if (s <= 1) {
          clearInterval(intervalRef.current);
          setTimerActive(false);
          playFinish();
          return 0;
        }
        if (s <= 4) playBeep(880, 0.1, 0.08);
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, [timerActive]);

  const getAudioCtx = () => {
    if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtxRef.current;
  };
  const playBeep = (freq = 660, vol = 0.12, dur = 0.1) => {
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq; osc.type = 'sine';
      gain.gain.setValueAtTime(vol, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.start(); osc.stop(ctx.currentTime + dur);
    } catch(e) {}
  };
  const playFinish = () => {
    try {
      const ctx = getAudioCtx();
      [[0,660],[0.18,880],[0.36,1100]].forEach(([t,f]) => {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = f; osc.type = 'triangle';
        gain.gain.setValueAtTime(0.25, ctx.currentTime + t);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.3);
        osc.start(ctx.currentTime + t); osc.stop(ctx.currentTime + t + 0.35);
      });
    } catch(e) {}
  };

  const startTimer = (secs = 90) => {
    setTimerTotal(secs);
    setTimerSecs(secs);
    setTimerActive(true);
    playBeep(440, 0.1, 0.08);
  };

  const toggleSet = (exIdx, setIdx, restSecs = 90) => {
    const key = `${exIdx}-${setIdx}`;
    const nowDone = !done[key];
    const newDone = { ...done, [key]: nowDone };
    setDone(newDone);
    if (nowDone) {
      setLastCompletedEx(exIdx);
      startTimer(restSecs);
    }
  };

  const handleWeightChange = (key, val) => {
    const n = { ...weights, [key]: val };
    setWeights(n);
    localStorage.setItem('yf_weights', JSON.stringify(n));
  };

  const timerMm = String(Math.floor(timerSecs / 60)).padStart(2, '0');
  const timerSs = String(timerSecs % 60).padStart(2, '0');
  const timerPct = timerTotal > 0 ? (timerSecs / timerTotal) : 0;
  const R = 22; const circ = 2 * Math.PI * R;

  if (!routine || !routine.exercises?.length) {
    return (
      <div style={{ padding: '40px 16px', textAlign: 'center', color: 'var(--theme-text-muted)' }}>
        <div style={{ fontSize: 40, marginBottom: 12 }}>😴</div>
        <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 14, color: 'var(--theme-text)', marginBottom: 8 }}>DIA DE DESCANSO</div>
        <div style={{ fontFamily: 'Inter', fontSize: 13 }}>Sem treino programado para hoje.</div>
        <button onClick={onBack} style={{ marginTop: 24, background: 'var(--primary)', border: 'none', borderRadius: 12, padding: '12px 24px', color: 'white', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 10, letterSpacing: '0.15em', cursor: 'pointer' }}>VOLTAR</button>
      </div>
    );
  }

  return (
    <div style={{ padding: '16px 16px 100px', maxWidth: 480, margin: '0 auto' }}>
      {/* Header */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 18 }}>
        <button onClick={onBack} style={{ background: 'var(--theme-input)', border: '1px solid var(--theme-divider)', borderRadius: 12, padding: '8px 10px', cursor: 'pointer', color: 'var(--theme-text-muted)', display: 'flex', alignItems: 'center' }}>
          <span className="material-symbols-outlined" style={{ fontSize: 20 }}>arrow_back</span>
        </button>
        <div style={{ flex: 1 }}>
          <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 7, letterSpacing: '0.25em', color: 'var(--primary)', textTransform: 'uppercase', marginBottom: 3 }}>Modo Treino Ativo</div>
          <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 16, color: 'var(--theme-text)', letterSpacing: '0.03em' }}>{routine.title}</div>
        </div>
      </div>

      {/* Progresso geral */}
      <div style={{ background: 'var(--theme-card)', borderRadius: 20, padding: '14px 18px', marginBottom: 16, border: '1px solid var(--theme-divider)' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
          <span style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 8, letterSpacing: '0.2em', color: 'var(--theme-text-muted)', textTransform: 'uppercase' }}>Progresso</span>
          <span style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 14, color: pct === 100 ? '#10B981' : 'var(--primary)' }}>{pct}%</span>
        </div>
        <div style={{ height: 8, background: 'var(--theme-divider)', borderRadius: 99, overflow: 'hidden' }}>
          <div style={{ height: '100%', width: `${pct}%`, background: pct === 100 ? '#10B981' : 'linear-gradient(90deg, var(--primary), #A770EF)', borderRadius: 99, transition: 'width 0.4s ease' }}></div>
        </div>
        <div style={{ fontFamily: 'Inter', fontSize: 11, color: 'var(--theme-text-muted)', marginTop: 6 }}>{doneSets} de {totalSets} séries concluídas</div>
      </div>

      {/* Timer flutuante de descanso */}
      {timerActive && (
        <div style={{ background: 'linear-gradient(135deg, rgba(255,107,74,0.15), rgba(167,112,239,0.1))', borderRadius: 20, padding: '14px 18px', marginBottom: 16, border: '1px solid rgba(255,107,74,0.3)', display: 'flex', alignItems: 'center', gap: 14 }}>
          <div style={{ position: 'relative', width: 56, height: 56, flexShrink: 0 }}>
            <svg width="56" height="56" viewBox="0 0 56 56" style={{ transform: 'rotate(-90deg)' }}>
              <circle cx="28" cy="28" r={R} fill="none" stroke="rgba(255,107,74,0.2)" strokeWidth="4" />
              <circle cx="28" cy="28" r={R} fill="none" stroke="var(--primary)" strokeWidth="4" strokeLinecap="round"
                strokeDasharray={circ} strokeDashoffset={circ - circ * (1 - timerPct)}
                style={{ transition: 'stroke-dashoffset 1s linear' }} />
            </svg>
            <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 11, color: 'var(--primary)' }}>
              {timerMm}:{timerSs}
            </div>
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 9, letterSpacing: '0.2em', color: 'var(--primary)', textTransform: 'uppercase', marginBottom: 3 }}>Descansando</div>
            <div style={{ fontFamily: 'Inter', fontSize: 12, color: 'var(--theme-text-muted)' }}>Próxima série em breve...</div>
          </div>
          <button onClick={() => { clearInterval(intervalRef.current); setTimerActive(false); }} style={{ background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.25)', borderRadius: 10, padding: '6px 10px', color: '#EF4444', cursor: 'pointer', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 8, letterSpacing: '0.1em' }}>PULAR</button>
        </div>
      )}

      {/* Lista de exercícios */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        {routine.exercises.map((ex, exIdx) => {
          const nSets = parseInt(ex.sets) || 3;
          const exDone = Array.from({ length: nSets }, (_, i) => done[`${exIdx}-${i}`]).filter(Boolean).length;
          const allDone = exDone === nSets;
          const wKey = `${currentDay}-${exIdx}`;

          return (
            <div key={exIdx} style={{ background: allDone ? 'rgba(16,185,129,0.05)' : 'var(--theme-card)', borderRadius: 20, padding: '16px', border: `1px solid ${allDone ? 'rgba(16,185,129,0.3)' : 'var(--theme-divider)'}`, transition: 'all 0.3s' }}>
              {/* Exercício header */}
              <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 12 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 3 }}>
                    {allDone && <span className="material-symbols-outlined" style={{ fontSize: 16, color: '#10B981' }}>check_circle</span>}
                    <span style={{ fontFamily: 'Inter', fontWeight: 600, fontSize: 14, color: allDone ? '#10B981' : 'var(--theme-text)' }}>{ex.name}</span>
                  </div>
                  <div style={{ fontFamily: 'Orbitron', fontWeight: 700, fontSize: 9, color: 'var(--primary)', letterSpacing: '0.1em' }}>{ex.sets} séries × {ex.reps}</div>
                  {ex.obs && <div style={{ fontFamily: 'Inter', fontSize: 11, color: 'var(--theme-text-muted)', marginTop: 4, fontStyle: 'italic' }}>{ex.obs}</div>}
                </div>
                <div style={{ display: 'flex', gap: 6 }}>
                  {ex.video && (
                    <a href={ex.video} target="_blank" rel="noopener noreferrer" style={{ background: 'rgba(255,107,74,0.1)', border: '1px solid rgba(255,107,74,0.25)', borderRadius: 8, padding: '5px 7px', color: 'var(--primary)', textDecoration: 'none', display: 'flex' }}>
                      <span className="material-symbols-outlined" style={{ fontSize: 15 }}>play_circle</span>
                    </a>
                  )}
                </div>
              </div>

              {/* Carga */}
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12, background: 'var(--theme-input)', borderRadius: 10, padding: '8px 12px' }}>
                <span className="material-symbols-outlined" style={{ fontSize: 14, color: 'var(--theme-text-muted)' }}>fitness_center</span>
                <span style={{ fontFamily: 'Orbitron', fontWeight: 700, fontSize: 8, letterSpacing: '0.15em', color: 'var(--theme-text-muted)', flex: 1, textTransform: 'uppercase' }}>Carga (kg)</span>
                <input type="number" placeholder="0" value={weights[wKey] || ''}
                  onChange={e => handleWeightChange(wKey, e.target.value)}
                  style={{ width: 56, background: 'var(--theme-card)', border: '1px solid var(--theme-divider)', borderRadius: 8, padding: '5px 8px', color: 'var(--theme-text)', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 14, textAlign: 'center', outline: 'none' }}
                />
              </div>

              {/* Séries */}
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                {Array.from({ length: nSets }, (_, setIdx) => {
                  const key = `${exIdx}-${setIdx}`;
                  const isDone = done[key];
                  return (
                    <button key={setIdx} onClick={() => toggleSet(exIdx, setIdx, 90)}
                      style={{ flex: 1, minWidth: 52, padding: '10px 0', borderRadius: 12, border: `2px solid ${isDone ? '#10B981' : 'var(--theme-divider)'}`, background: isDone ? 'rgba(16,185,129,0.12)' : 'var(--theme-input)', color: isDone ? '#10B981' : 'var(--theme-text-muted)', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 11, cursor: 'pointer', transition: 'all 0.2s', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3 }}>
                      {isDone
                        ? <span className="material-symbols-outlined" style={{ fontSize: 18, color: '#10B981' }}>check</span>
                        : <span style={{ fontSize: 13 }}>{setIdx + 1}</span>
                      }
                      <span style={{ fontSize: 7, letterSpacing: '0.1em', opacity: 0.7 }}>SÉR</span>
                    </button>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>

      {/* Concluir treino */}
      {pct === 100 && (
        <div style={{ marginTop: 20, background: 'linear-gradient(135deg, #10B981, #059669)', borderRadius: 20, padding: '20px', textAlign: 'center' }}>
          <div style={{ fontSize: 36, marginBottom: 8 }}>🏆</div>
          <div style={{ fontFamily: 'Orbitron', fontWeight: 900, fontSize: 16, color: 'white', letterSpacing: '0.08em', marginBottom: 6 }}>TREINO CONCLUÍDO!</div>
          <div style={{ fontFamily: 'Inter', fontSize: 13, color: 'rgba(255,255,255,0.8)', marginBottom: 16 }}>Excelente! {totalSets} séries completadas.</div>
          <button onClick={onBack} style={{ background: 'white', border: 'none', borderRadius: 12, padding: '12px 24px', color: '#10B981', fontFamily: 'Orbitron', fontWeight: 900, fontSize: 11, letterSpacing: '0.15em', cursor: 'pointer' }}>FINALIZAR</button>
        </div>
      )}
    </div>
  );
}

Object.assign(window, { ActiveWorkoutTab });
